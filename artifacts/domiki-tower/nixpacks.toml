[phases.setup]
nixPkgs = ["nodejs_22", "nodePackages.pnpm"]

[phases.install]
cmds = [
  "node --version",
  "pnpm --version",
  "pnpm install --ignore-scripts --no-frozen-lockfile"
]

[phases.build]
cmds = [
  "node_modules/.bin/vite build --config vite.config.ts"
]

[start]
cmd = "node_modules/.bin/vite preview --config vite.config.ts --host 0.0.0.0"
